[package]
name = "ossi-id-generator"
version = "1.2.0"
description = "ID Card Generator (Tauri/Rust version)"
authors = ["ID Card Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: keep Ctrl+Shift+I / right-click Inspect available in release builds, as in the Electron app
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps pin-config.json keys in their original order when it is rewritten
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"
# crop / pad the ID photo and signature to their card boxes (CorelDRAW ignores SVG preserveAspectRatio)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# QR code on the back ID (only the module grid is used; it is drawn as an SVG path)
qrcode = { version = "0.14", default-features = false }
# Measures centred card text with the installed fonts (same shaping as Chrome/WebView2) so it can be
# written left-anchored, which CorelDRAW imports exactly
rustybuzz = "0.20"
# Password-encrypted "send to other PC" files: Argon2id turns the password into a key, AES-256-GCM encrypts
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
