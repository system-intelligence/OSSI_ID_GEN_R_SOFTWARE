[package]
name = "ossi-id-generator"
version = "1.0.0"
description = "ID Card Generator (Tauri/Rust version)"
authors = ["ID Card Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: keep Ctrl+Shift+I / right-click Inspect available in release builds, as in the Electron app
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps pin-config.json keys in their original order when it is rewritten
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
